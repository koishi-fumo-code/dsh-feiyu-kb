desc: 合并三条鱼 · P3。收到消息 → POST /api/feiyu-chat → 回文字，再合成一条 feiyu-voice「重糯·磁性」语音（先文字后语音）。DSH 的 Web 端口每次重启都会变，插件会扫本机监听端口自动发现。默认关闭；确认 DSH 端点通了再 /鲸鲸 on 打开。
